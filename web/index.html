<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frodo Follower</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #1a1a2e;
  color: #e0e0e0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Header ── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  height: 36px;
  background: #16213e;
  border-bottom: 1px solid #0f3460;
  flex-shrink: 0;
}
.header-title {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #e0e0e0;
}
.header-stats {
  display: flex;
  align-items: center;
  gap: 18px;
  font-size: 12px;
}
.header-stats .label {
  color: #6b7280;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-right: 4px;
}
.header-stats .value {
  font-family: 'Courier New', Courier, monospace;
  color: #e0e0e0;
}
.badge {
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 3px;
  font-weight: 600;
  letter-spacing: 0.3px;
}
.badge-gpu { background: #064e3b; color: #6ee7b7; }
.badge-cpu { background: #450a0a; color: #fca5a5; }
.badge-live { background: #1e3a5f; color: #93c5fd; }

/* ── Grid Layout ── */
.content-grid {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 1px;
  background: #0f3460; /* the gap acts as borders */
  overflow: hidden;
}

.quadrant {
  background: #000;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.quadrant img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

.feed-label {
  position: absolute;
  top: 10px;
  left: 10px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #9ca3af;
  background: rgba(0,0,0,0.7);
  padding: 4px 8px;
  border-radius: 4px;
}

.tracker-state {
  position: absolute;
  top: 10px;
  right: 10px;
  font-size: 12px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 4px;
  background: rgba(0,0,0,0.7);
  display: none;
}
.tracker-state.tracking  { display: block; color: #6ee7b7; }
.tracker-state.predicting { display: block; color: #fcd34d; }
.tracker-state.searching { display: block; color: #f97316; }
.tracker-state.lost      { display: block; color: #ef4444; }

/* ── Quadrant 2: Controls ── */
.quad-ctrl {
  background: #16213e;
  padding: 24px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: stretch;
  gap: 20px;
}

/* Command row */
.cmd-row {
  display: flex;
  align-items: center;
  gap: 12px;
}
.cmd-input {
  flex: 1;
  background: #1a1a2e;
  border: 1px solid #0f3460;
  border-radius: 6px;
  padding: 12px 14px;
  color: #e0e0e0;
  font-size: 15px;
  outline: none;
}
.cmd-input:focus {
  border-color: #3b82f6;
}
.cmd-input::placeholder {
  color: #4b5563;
}
.btn {
  padding: 12px 20px;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border: none;
}
.btn-send {
  background: #3b82f6;
  color: #fff;
}
.btn-send:hover { background: #2563eb; }
.btn-stop {
  background: #1a1a2e;
  border: 1px solid #374151;
  color: #ef4444;
}
.btn-stop:hover { background: #271a1a; }

/* Status row */
.status-row {
  font-size: 14px;
  color: #9ca3af;
  line-height: 1.5;
}
.status-text {
  color: #d1d5db;
  font-weight: 500;
}

/* Detected objects */
.detected-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.detected-label {
  color: #6b7280;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-right: 4px;
}
.obj-tag {
  font-size: 13px;
  padding: 4px 10px;
  border-radius: 4px;
  background: #1a1a2e;
  border: 1px solid #374151;
  color: #9ca3af;
  cursor: pointer;
}
.obj-tag:hover {
  border-color: #3b82f6;
  color: #93c5fd;
}
.obj-tag.active {
  border-color: #3b82f6;
  color: #93c5fd;
  background: #1e293b;
}

/* Metrics row */
.metrics-row {
  display: flex;
  gap: 24px;
  font-size: 14px;
  font-family: 'Courier New', Courier, monospace;
  color: #9ca3af;
  background: #1a1a2e;
  padding: 16px;
  border-radius: 6px;
  border: 1px solid #0f3460;
}
.metric .m-label {
  color: #6b7280;
  font-size: 11px;
  text-transform: uppercase;
  margin-right: 6px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
.metric .m-value {
  color: #e0e0e0;
  font-weight: 600;
}
</style>
</head>
<body>

<div class="header">
  <span class="header-title">Frodo Follower</span>
  <div class="header-stats">
    <span><span class="label">FPS</span><span class="value" id="fps-val">—</span></span>
    <span id="dev-badge" class="badge badge-gpu">GPU</span>
    <span class="badge badge-live">LIVE</span>
  </div>
</div>

<div class="content-grid">
  <!-- Quadrant 1: Camera Feed -->
  <div class="quadrant quad-cam">
    <img id="main-feed" src="" alt="Detection feed">
    <span class="feed-label">Detection</span>
    <span class="tracker-state" id="tracker-state"></span>
  </div>

  <!-- Quadrant 2: Controls -->
  <div class="quadrant quad-ctrl">
    <div class="cmd-row">
      <input class="cmd-input" id="cmd-input" type="text" placeholder="go to the chair..." autofocus>
      <button class="btn btn-send" id="btn-send" onclick="sendCmd()">Send</button>
      <button class="btn btn-stop" onclick="stopRobot()">&#9632; Stop</button>
    </div>

    <div class="status-row">
      <div><span>Status: </span><span class="status-text" id="status-text">Initializing...</span></div>
      <div style="margin-top:4px"><span>Target: </span><span class="status-text" id="target-text" style="color:#3b82f6">None</span></div>
    </div>

    <div class="detected-row">
      <span class="detected-label">Detected</span>
      <span id="obj-cloud" style="display:flex;gap:6px;flex-wrap:wrap"></span>
    </div>

    <div class="metrics-row">
      <span class="metric"><span class="m-label">Lin</span><span class="m-value" id="m-lin">0.00</span></span>
      <span class="metric"><span class="m-label">Ang</span><span class="m-value" id="m-ang">0.00</span></span>
      <span class="metric"><span class="m-label">Dist</span><span class="m-value" id="m-dist">—</span></span>
      <span class="metric"><span class="m-label">Angle</span><span class="m-value" id="m-angle">—</span></span>
    </div>
  </div>

  <!-- Quadrant 3: Depth Map -->
  <div class="quadrant quad-depth">
    <img id="depth-feed" src="" alt="Depth map">
    <span class="feed-label">Depth</span>
  </div>

  <!-- Quadrant 4: MPPI Cost Map -->
  <div class="quadrant quad-mppi">
    <img id="mppi-feed" src="" alt="MPPI cost map">
    <span class="feed-label">MPPI</span>
  </div>
</div>

<script>
document.getElementById('cmd-input').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') sendCmd();
});

function sendCmd() {
  var inp = document.getElementById('cmd-input');
  var cmd = inp.value.trim();
  if (!cmd) return;
  inp.value = '';
  fetch('/command', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({command: cmd})
  }).then(function(r) { return r.json(); })
    .then(function(d) {
      document.getElementById('status-text').textContent = d.message || d.status || 'Sent';
    });
}

function stopRobot() {
  fetch('/command', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({command: 'stop'})
  }).then(function() {
    document.getElementById('status-text').textContent = 'Stopped.';
  });
}

function updateFeed() {
  fetch('/state').then(function(r) { return r.json(); }).then(function(d) {
    // Images
    if (d.annotated) document.getElementById('main-feed').src = 'data:image/jpeg;base64,' + d.annotated;
    if (d.depth)     document.getElementById('depth-feed').src = 'data:image/jpeg;base64,' + d.depth;
    if (d.mppi)      document.getElementById('mppi-feed').src  = 'data:image/jpeg;base64,' + d.mppi;

    // Header
    document.getElementById('fps-val').textContent = (d.fps || 0).toFixed(1);
    var badge = document.getElementById('dev-badge');
    var isGpu = (d.gpu || '').toLowerCase() === 'cuda';
    badge.textContent = isGpu ? 'GPU' : 'CPU';
    badge.className = 'badge ' + (isGpu ? 'badge-gpu' : 'badge-cpu');

    // Status
    document.getElementById('status-text').textContent = d.status || '—';
    var targetEl = document.getElementById('target-text');
    if (d.target) {
      targetEl.textContent = d.target;
      targetEl.style.color = '#3b82f6';
    } else {
      targetEl.textContent = 'None';
      targetEl.style.color = '#6b7280';
    }

    // Tracker state
    var ts = document.getElementById('tracker-state');
    var trackerState = (d.tracker_state || '').toLowerCase();
    ts.className = 'tracker-state ' + trackerState;
    ts.textContent = trackerState ? trackerState.toUpperCase() : '';

    // Metrics
    document.getElementById('m-lin').textContent = (d.linear || 0).toFixed(2);
    document.getElementById('m-ang').textContent = (d.angular || 0).toFixed(2);
    document.getElementById('m-dist').textContent = d.distance ? d.distance.toFixed(2) + 'm' : '—';
    document.getElementById('m-angle').textContent = d.angle ? d.angle.toFixed(1) + '\u00B0' : '—';

    // Detected objects
    var cloud = document.getElementById('obj-cloud');
    cloud.innerHTML = '';
    (d.objects || []).sort().forEach(function(obj) {
      var tag = document.createElement('span');
      tag.className = 'obj-tag' + (obj === d.target ? ' active' : '');
      tag.textContent = obj;
      tag.onclick = function() {
        fetch('/command', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({command: 'go to the ' + obj})
        });
      };
      cloud.appendChild(tag);
    });

  }).catch(function() {});
}

setInterval(updateFeed, 300);
</script>
</body>
</html>
