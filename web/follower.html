<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FrodoBot | Personal Follower</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 1.5rem 2rem;
            background: linear-gradient(to right, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.8));
            border-bottom: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: -0.5px;
            color: var(--accent);
        }

        .status-badge {
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            background: rgba(59, 130, 246, 0.1);
            color: var(--accent);
            border: 1px solid rgba(59, 130, 246, 0.3);
            transition: all 0.3s ease;
        }

        .status-badge.locked {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border-color: rgba(16, 185, 129, 0.3);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
        }

        .main-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
            padding: 2rem;
            flex-grow: 1;
        }

        .panel {
            background: var(--panel-bg);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        .panel h2 {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* Video Feed Container */
        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            cursor: crosshair;
        }

        .video-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .click-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
        }

        .instruction-overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7);
            padding: 1rem 2rem;
            border-radius: 999px;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        /* Telemetry & Controls */
        .telemetry-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: rgba(0,0,0,0.2);
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
        }

        .controls {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        button {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--danger);
            color: white;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }

        button:hover {
            background: var(--danger-hover);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .safety-feed {
            margin-top: 2rem;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16/9;
            background: #000;
            position: relative;
        }
        .safety-feed img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.6;
        }
        .safety-label {
            position: absolute;
            top: 0.5rem; left: 0.5rem;
            background: rgba(0,0,0,0.8);
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        @media (max-width: 1024px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>FRODO<span style="color:white">BOT</span> <span style="font-weight:400; color:var(--text-muted)">| Follower</span></h1>
        <div id="statusBadge" class="status-badge">Standby</div>
    </header>

    <div class="main-container">
        <!-- Main Feed -->
        <div class="panel">
            <h2>Tracking Camera</h2>
            <div class="video-wrapper">
                <img id="mainFeed" src="" alt="Waiting for feed...">
                <div id="instructionOverlay" class="instruction-overlay">
                    Click a person to Lock On
                </div>
                <div class="click-overlay" id="clickLayer"></div>
            </div>
        </div>

        <!-- Dashboard -->
        <div class="panel">
            <h2>Telemetry</h2>
            <div class="telemetry-grid">
                <div class="stat-card">
                    <div class="stat-label">Linear Speed</div>
                    <div class="stat-value"><span id="valLin">0.00</span> <span style="font-size:0.8rem;color:var(--text-muted)">m/s</span></div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Angular Speed</div>
                    <div class="stat-value"><span id="valAng">0.00</span> <span style="font-size:0.8rem;color:var(--text-muted)">rad/s</span></div>
                </div>
            </div>

            <div class="controls">
                <button id="btnStop" onclick="stopTracking()">Emergency Stop & Unlock</button>
            </div>

            <div id="statusText" style="
                margin-top: 1rem;
                padding: 0.75rem 1rem;
                background: rgba(0,0,0,0.2);
                border-radius: 10px;
                font-size: 0.85rem;
                color: var(--text-muted);
                min-height: 2.5rem;
                word-break: break-word;
            "></div>

            <div class="safety-feed">
                <div class="safety-label">Background Safety Depth</div>
                <img id="depthFeed" src="" alt="">
            </div>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:5001";
        const clickLayer = document.getElementById('clickLayer');
        const mainFeed = document.getElementById('mainFeed');
        const depthFeed = document.getElementById('depthFeed');
        const statusBadge = document.getElementById('statusBadge');
        const instructionOverlay = document.getElementById('instructionOverlay');
        const valLin = document.getElementById('valLin');
        const valAng = document.getElementById('valAng');
        const statusText = document.getElementById('statusText');

        // Click to Lock
        clickLayer.addEventListener('click', (e) => {
            const rect = clickLayer.getBoundingClientRect();
            
            // Send normalized coordinates (0.0 to 1.0)
            const x = (e.clientX - rect.left) / rect.width;
            const y = (e.clientY - rect.top) / rect.height;

            fetch(`${API_URL}/lock`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ x: x, y: y })
            });
        });

        function stopTracking() {
            fetch(`${API_URL}/stop`, { method: 'POST' });
        }

        // Poll State
        setInterval(async () => {
            try {
                const res = await fetch(`${API_URL}/state`);
                const state = await res.json();

                if (state.frame) {
                    mainFeed.src = 'data:image/jpeg;base64,' + state.frame;
                }
                if (state.depth_frame) {
                    depthFeed.src = 'data:image/jpeg;base64,' + state.depth_frame;
                }

                if (state.locked) {
                    statusBadge.textContent = "Locked On";
                    statusBadge.classList.add('locked');
                    instructionOverlay.style.opacity = '0';
                } else {
                    statusBadge.textContent = "Standby";
                    statusBadge.classList.remove('locked');
                    instructionOverlay.style.opacity = '1';
                }

                statusText.textContent = state.status || '';
                if (state.vlm && state.vlm !== 'VLM ready') {
                    statusText.textContent += ' | ' + state.vlm;
                }

                valLin.textContent = state.linear.toFixed(2);
                valAng.textContent = state.angular.toFixed(2);

            } catch (e) {
                console.error("Polling error", e);
            }
        }, 150); // fast polling for low latency UI
    </script>
</body>
</html>
