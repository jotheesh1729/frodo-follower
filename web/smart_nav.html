<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FrodoBot | Smart Navigator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:     #0f172a;
            --panel:  #1e293b;
            --fg:     #f8fafc;
            --muted:  #94a3b8;
            --blue:   #3b82f6;
            --green:  #10b981;
            --red:    #ef4444;
            --yellow: #f59e0b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--fg); min-height: 100vh; display: flex; flex-direction: column; }

        header {
            padding: 1rem 2rem;
            background: linear-gradient(to right, rgba(30,41,59,.85), rgba(15,23,42,.85));
            border-bottom: 1px solid rgba(255,255,255,.08);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }
        header h1 { font-weight: 800; font-size: 1.35rem; color: var(--blue); white-space: nowrap; }

        .badge {
            padding: .4rem 1rem;
            border-radius: 999px;
            font-size: .8rem;
            font-weight: 600;
            border: 1px solid;
            transition: all .3s;
            white-space: nowrap;
        }
        .badge.idle     { background: rgba(59,130,246,.1);  color: var(--blue);   border-color: rgba(59,130,246,.3); }
        .badge.nav      { background: rgba(245,158,11,.1);  color: var(--yellow); border-color: rgba(245,158,11,.3); }
        .badge.arrived  { background: rgba(16,185,129,.1);  color: var(--green);  border-color: rgba(16,185,129,.3);
                          box-shadow: 0 0 12px rgba(16,185,129,.2); }
        .badge.search   { background: rgba(59,130,246,.08); color: var(--blue);   border-color: rgba(59,130,246,.2); }

        .main {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1.5rem;
            padding: 1.5rem;
            flex: 1;
        }

        .panel {
            background: var(--panel);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,.05);
            padding: 1.25rem;
            box-shadow: 0 10px 30px rgba(0,0,0,.5);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .panel-title {
            font-size: .8rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .feed {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
        }
        .feed img { width: 100%; height: 100%; object-fit: cover; }

        /* Query row */
        .query-row { display: flex; gap: .6rem; }
        .query-row input {
            flex: 1;
            background: rgba(0,0,0,.35);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 10px;
            padding: .7rem 1rem;
            color: var(--fg);
            font-size: .95rem;
            transition: border-color .2s;
        }
        .query-row input:focus { outline: none; border-color: var(--blue); }
        .query-row input::placeholder { color: var(--muted); }
        .go-btn {
            padding: .7rem 1.4rem;
            background: var(--blue);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: .95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s;
            flex-shrink: 0;
        }
        .go-btn:hover { background: #2563eb; transform: translateY(-1px); }
        .go-btn:active { transform: none; }

        .status-text {
            font-size: .9rem;
            color: var(--muted);
            min-height: 1.4rem;
            padding: .5rem .75rem;
            background: rgba(0,0,0,.2);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,.04);
        }

        /* Stats */
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
        .stat {
            background: rgba(0,0,0,.25);
            border: 1px solid rgba(255,255,255,.05);
            border-radius: 10px;
            padding: .75rem;
        }
        .stat-label { font-size: .68rem; color: var(--muted); text-transform: uppercase; margin-bottom: .2rem; letter-spacing: .5px; }
        .stat-value { font-size: 1.35rem; font-weight: 800; font-variant-numeric: tabular-nums; }
        .stat-unit  { font-size: .7rem; color: var(--muted); }

        /* VLM box */
        .vlm-row { display: flex; flex-direction: column; gap: .5rem; }
        .vlm-status {
            font-size: .78rem;
            color: var(--muted);
            background: rgba(0,0,0,.2);
            border: 1px solid rgba(255,255,255,.05);
            border-radius: 8px;
            padding: .5rem .75rem;
            min-height: 2.2rem;
            word-break: break-all;
        }
        .vlm-status span { color: var(--fg); }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: .3rem;
            padding: .25rem .75rem;
            border-radius: 999px;
            font-size: .75rem;
            font-weight: 600;
            border: 1px solid;
        }
        .pill.verified   { background: rgba(16,185,129,.12); color: var(--green);  border-color: rgba(16,185,129,.3); }
        .pill.unverified { background: rgba(245,158,11,.08); color: var(--yellow); border-color: rgba(245,158,11,.2); }
        .pill.rejected   { background: rgba(239,68,68,.08);  color: var(--red);    border-color: rgba(239,68,68,.2);  }

        /* Depth mini-feed */
        .depth-wrap {
            border-radius: 10px;
            overflow: hidden;
            aspect-ratio: 16/9;
            background: #000;
            position: relative;
            margin-top: auto;
        }
        .depth-wrap img { width: 100%; height: 100%; object-fit: cover; opacity: .75; }
        .depth-label {
            position: absolute;
            top: .4rem; left: .5rem;
            background: rgba(0,0,0,.75);
            padding: .2rem .6rem;
            border-radius: 999px;
            font-size: .68rem;
            color: var(--muted);
            pointer-events: none;
        }

        /* Stop button */
        .stop-btn {
            width: 100%;
            padding: .9rem;
            background: var(--red);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: .95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all .2s;
            box-shadow: 0 4px 15px rgba(239,68,68,.3);
            letter-spacing: .3px;
        }
        .stop-btn:hover { background: #dc2626; transform: translateY(-2px); }
        .stop-btn:active { transform: none; }

        /* Legend */
        .legend {
            display: flex;
            gap: 1rem;
            font-size: .72rem;
            color: var(--muted);
            flex-wrap: wrap;
        }
        .legend-dot {
            display: inline-block;
            width: 10px; height: 10px;
            border-radius: 2px;
            margin-right: .3rem;
            vertical-align: middle;
        }

        @media (max-width: 900px) {
            .main { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <h1>FRODO<span style="color:#fff">BOT</span>
            <span style="font-weight:400; color:var(--muted)"> | Smart Navigator</span>
        </h1>
        <div id="badge" class="badge idle">Idle</div>
    </header>

    <div class="main">

        <!-- ── Left: camera + query ─────────────────────────── -->
        <div class="panel">
            <div class="panel-title">Camera Feed</div>

            <div class="feed">
                <img id="mainFeed" src="" alt="Connecting to robot…">
            </div>

            <div class="legend">
                <span><span class="legend-dot" style="background:#00ff50"></span>Trusted (high conf or VLM ✓)</span>
                <span><span class="legend-dot" style="background:#c8c800"></span>Unverified (medium conf)</span>
                <span><span class="legend-dot" style="background:#00ffff; border: 1px solid #00ffff"></span>EKF locked target</span>
            </div>

            <div class="query-row">
                <input id="queryInput" type="text"
                    placeholder="Type anything: 'red chair', 'blue bottle', 'person in red shirt'…" />
                <button class="go-btn" onclick="sendQuery()">Go</button>
            </div>

            <div id="statusText" class="status-text">Idle — set a target above</div>
        </div>

        <!-- ── Right: telemetry ─────────────────────────────── -->
        <div class="panel">
            <div class="panel-title">Telemetry</div>

            <div class="stats">
                <div class="stat">
                    <div class="stat-label">Distance</div>
                    <div class="stat-value">
                        <span id="dist">—</span>
                        <span class="stat-unit"> m</span>
                    </div>
                </div>
                <div class="stat">
                    <div class="stat-label">Bearing</div>
                    <div class="stat-value">
                        <span id="angle">—</span>
                        <span class="stat-unit"> °</span>
                    </div>
                </div>
                <div class="stat">
                    <div class="stat-label">Linear</div>
                    <div class="stat-value">
                        <span id="lin">0.00</span>
                        <span class="stat-unit"> m/s</span>
                    </div>
                </div>
                <div class="stat">
                    <div class="stat-label">Angular</div>
                    <div class="stat-value">
                        <span id="ang">0.00</span>
                        <span class="stat-unit"> r/s</span>
                    </div>
                </div>
            </div>

            <!-- VLM status -->
            <div class="vlm-row">
                <div class="panel-title">VLM Verifier</div>
                <div class="vlm-status"><span id="vlmStatus">Loading…</span></div>
                <div id="verifiedPill">
                    <span class="pill unverified">⏳ Unverified</span>
                </div>
            </div>

            <button class="stop-btn" onclick="stopRobot()">Emergency Stop</button>

            <!-- Depth mini-feed -->
            <div class="depth-wrap">
                <div class="depth-label">Depth Map (DA3)</div>
                <img id="depthFeed" src="" alt="">
            </div>

        </div>
    </div>

    <script>
        const API = "http://localhost:5002";

        const mainFeed    = document.getElementById('mainFeed');
        const depthFeed   = document.getElementById('depthFeed');
        const badge       = document.getElementById('badge');
        const statusText  = document.getElementById('statusText');
        const distEl      = document.getElementById('dist');
        const angleEl     = document.getElementById('angle');
        const linEl       = document.getElementById('lin');
        const angEl       = document.getElementById('ang');
        const vlmEl       = document.getElementById('vlmStatus');
        const verifiedPill = document.getElementById('verifiedPill');

        function sendQuery() {
            const q = document.getElementById('queryInput').value.trim();
            if (!q) return;
            fetch(`${API}/query`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ query: q }),
            });
        }

        function stopRobot() {
            fetch(`${API}/stop`, { method: 'POST' });
            document.getElementById('queryInput').value = '';
        }

        document.getElementById('queryInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') sendQuery();
        });

        setInterval(async () => {
            let s;
            try {
                s = await (await fetch(`${API}/state`)).json();
            } catch { return; }

            if (s.frame) mainFeed.src  = 'data:image/jpeg;base64,' + s.frame;
            if (s.depth) depthFeed.src = 'data:image/jpeg;base64,' + s.depth;

            statusText.textContent = s.status || '';
            vlmEl.textContent      = s.vlm    || '—';
            linEl.textContent      = (s.linear  ?? 0).toFixed(2);
            angEl.textContent      = (s.angular ?? 0).toFixed(2);
            distEl.textContent  = s.distance != null ? s.distance.toFixed(1) : '—';
            angleEl.textContent = s.angle    != null ? s.angle.toFixed(0)    : '—';

            // Header badge
            const st = s.status || '';
            if      (st.startsWith('→'))         { badge.textContent = 'Navigating'; badge.className = 'badge nav';     }
            else if (st.startsWith('Arrived'))   { badge.textContent = 'Arrived';    badge.className = 'badge arrived';  }
            else if (st.startsWith('Searching')) { badge.textContent = 'Searching';  badge.className = 'badge search';   }
            else if (st.startsWith('Lost'))      { badge.textContent = 'Lost';       badge.className = 'badge nav';      }
            else                                 { badge.textContent = 'Idle';       badge.className = 'badge idle';     }

            // VLM verification pill
            if (s.verified) {
                verifiedPill.innerHTML = '<span class="pill verified">✓ VLM Verified</span>';
            } else if (s.vlm && s.vlm.startsWith('✗')) {
                verifiedPill.innerHTML = '<span class="pill rejected">✗ VLM Rejected</span>';
            } else {
                verifiedPill.innerHTML = '<span class="pill unverified">⏳ Unverified</span>';
            }
        }, 150);
    </script>
</body>
</html>
